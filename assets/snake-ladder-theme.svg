<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Snake and Ladder themed profile banner</title>
  <desc id="desc">Animated snake and ladder board in dark mode with cyan and pink accents, and a token moving across the board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08101C"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="50" x2="520" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="snake" x1="560" y1="90" x2="850" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="280" rx="18" fill="url(#bg)"/>

  <g opacity="0.9">
    <rect x="120" y="40" width="400" height="200" rx="12" stroke="#334155"/>
    <g stroke="#1E293B">
      <line x1="200" y1="40" x2="200" y2="240"/>
      <line x1="280" y1="40" x2="280" y2="240"/>
      <line x1="360" y1="40" x2="360" y2="240"/>
      <line x1="440" y1="40" x2="440" y2="240"/>
      <line x1="120" y1="80" x2="520" y2="80"/>
      <line x1="120" y1="120" x2="520" y2="120"/>
      <line x1="120" y1="160" x2="520" y2="160"/>
      <line x1="120" y1="200" x2="520" y2="200"/>
    </g>

    <path d="M170 216L250 136L325 176L405 96" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M218 216L202 226L198 206Z" fill="#7DD3FC"/>
    <path d="M452 98L436 108L432 88Z" fill="#5EEAD4"/>

    <path d="M500 56C560 72 536 120 484 130C430 140 436 188 500 212" stroke="url(#snake)" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-width" values="8;10;8" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="503" cy="212" r="8" fill="#F472B6"/>
    <circle cx="503" cy="212" r="2" fill="#0F172A"/>
  </g>

  <g>
    <circle r="10" fill="#7DD3FC" stroke="#F8FAFC" stroke-width="2" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <path id="route" d="M160 220L240 220L240 180L320 180L320 140L400 140L400 100L480 100" fill="none"/>
  </g>

  <text x="565" y="112" fill="#E2E8F0" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700">Snake &amp; Ladder</text>
  <text x="565" y="146" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="15">Keep climbing. Dodge setbacks. Stay consistent.</text>
</svg>
